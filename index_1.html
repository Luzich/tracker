<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1412">
<title>Выживание</title>
<style>
:root{--bg:#1a1412;--card:#2a201b;--line:#5a4632;--gold:#d4a84b;--txt:#eadfc8;--red:#b23a3a;--blue:#3a7bd5;--green:#5a9a4a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,serif}
body{padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);max-width:480px;margin:0 auto}
h1{font-size:20px;text-align:center;color:var(--gold);margin:16px 0}
section{display:none}
section.on{display:block}
input,button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0}
input{width:100%}
button{cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1;min-width:70px}
.tab.on{background:var(--red);border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.head{border-color:var(--gold);text-align:center}
.banner{border-color:var(--gold);background:#3a2a14}
.row{display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;background:#120d0b;border-radius:5px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl input{flex:1;min-width:90px}
.ghost{background:none}
.big{width:100%;background:var(--red);border-color:var(--gold);font-size:18px}
.err{color:#e57373;min-height:20px}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:block;margin:8px 0}
.mt{margin-top:8px}
.sub{opacity:.75;font-size:14px}
.ok{color:#8fcf7a}
.gold{color:var(--gold)}
.x{background:none;border:none;padding:2px 8px}
</style></head><body>
<h1>⚔ Выживание</h1>

<section id="login">
  <input id="email" type="email" placeholder="Почта" autocomplete="username">
  <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button onclick="login()">Войти</button>
  <div class="err" id="err"></div>
</section>

<section id="name">
  <p>Как тебя зовут в приложении? (Илья или Даша)</p>
  <input id="nm" type="text" placeholder="Имя">
  <button onclick="saveName()">Сохранить</button>
</section>

<section id="app">
  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>
  <button class="ghost" onclick="logout()">Выйти</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://dxhsbbafmjwnamquzbjz.supabase.co';
const SB_KEY='sb_publishable_XSjCHnz2HQ6Uh-z62TIvcg_xwuuzo-f';

// ===== План каждого профиля (задан заранее, в приложении не меняется) =====
const PLANS={
  'илья':{water_ml:3000,protein_g:180,km:8,train:true},
  'даша':{water_ml:2000,protein_g:80,km:5},
  'дарья':{water_ml:2000,protein_g:80,km:5}
};
// ===== Сезон =====
const CYCLE=10,CYCLES=9,SEASON=CYCLE*CYCLES,REST=2,MAXLVL=30;
// Игровой день начинается в 12:00 и длится до 11:59 следующего дня
const DAY_START_HOUR=12;

const M=[
 {k:'water_ml',t:'Вода',u:'мл',quick:[250,500]},
 {k:'kcal',t:'Ккал',u:'ккал',quick:[]},
 {k:'protein_g',t:'Белок',u:'г',quick:[]},
 {k:'km',t:'Километры',u:'км',quick:[]}
];
const GL={water_ml:'Вода',protein_g:'Белок',km:'Км',food:'Еда записана'};
const TITLES=[[30,'Легенда'],[25,'Герой'],[20,'Ветеран'],[15,'Страж'],[10,'Следопыт'],[5,'Бродяга'],[1,'Новобранец']];
const THRONE=[[12,'Повелитель трона'],[8,'Хранитель трона'],[5,'Почётный посетитель'],[3,'Постоянный гость'],[1,'Визит вежливости'],[0,'Трон пока пустует']];

const db=supabase.createClient(SB_URL,SB_KEY);
let me=null,profiles={},viewId=null,rows=[],sets=[],hist=[],rests=[],season=null,sub='sum',newCycle=0;
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date(Date.now()-DAY_START_HOUR*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayAdd=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const fmt=d=>d.slice(8,10)+'.'+d.slice(5,7);
const r1=v=>Math.round(v*10)/10;
const pct=v=>Math.round(v*100)+'%';
const planOf=id=>PLANS[((profiles[id]&&profiles[id].name)||'').trim().toLowerCase()]||{};
const goalsList=id=>{const p=planOf(id);return ['water_ml','protein_g','km'].filter(k=>p[k]>0).concat('food')};
const xpFor=L=>{const n=L-1;return 7*n*n+130*n};
const titleOf=L=>TITLES.find(t=>L>=t[0])[1];
function lvlOf(xp){let L=1;while(L<MAXLVL&&xp>=xpFor(L+1))L++;return {lvl:L,lo:xpFor(L),hi:L<MAXLVL?xpFor(L+1):xpFor(L),title:titleOf(L)}}
function mk(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined&&txt!=='')e.textContent=txt;if(cls)e.className=cls;return e}
function bar(v,g,color){const b=mk('div','','bar'),i=mk('i');i.style.width=Math.max(0,Math.min(100,g?v/g*100:0))+'%';if(color)i.style.background=color;b.appendChild(i);return b}
function show(id){['login','name','app'].forEach(s=>$(s).classList.toggle('on',s===id))}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){show('login');return}
  me=session.user;
  await loadProfiles();
  if(!profiles[me.id]){show('name');return}
  if(!viewId)viewId=me.id;
  show('app');
  await refresh();
}
async function login(){
  $('err').textContent='';
  const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error){$('err').textContent='Не вышло: '+error.message;return}
  init();
}
async function logout(){await db.auth.signOut();me=null;viewId=null;show('login')}
async function saveName(){
  const n=$('nm').value.trim();
  if(!n)return;
  const {error}=await db.from('profiles').upsert({user_id:me.id,name:n});
  if(error){alert('Ошибка: '+error.message);return}
  init();
}
async function loadProfiles(){
  const {data}=await db.from('profiles').select('*');
  profiles={};
  (data||[]).forEach(p=>profiles[p.user_id]=p);
}
async function loadAll(table,orders){
  let all=[],from=0;
  while(true){
    let q=db.from(table).select('*');
    orders.forEach(o=>{q=q.order(o)});
    const {data,error}=await q.range(from,from+999);
    if(error)throw error;
    all=all.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  return all;
}
async function refresh(){
  try{
    await loadProfiles();
    const s=await db.from('season').select('*').eq('id',1).maybeSingle();
    if(s.error)throw s.error;
    season=s.data?s.data.start_day:null;
    const r=await db.from('entries').select('*').eq('day',today()).order('id');
    if(r.error)throw r.error;
    rows=r.data;
    sets=await loadAll('sets',['id']);
    hist=await loadAll('daily',['day','kind','user_id']);
    rests=await loadAll('cheat_days',['day','user_id']);
  }catch(e){alert('Ошибка загрузки: '+(e.message||e));return}
  checkCycleEnd();
  render();
}
const sum=(uid,k)=>rows.filter(r=>r.user_id===uid&&r.kind===k).reduce((a,r)=>a+Number(r.value),0);

// ===================== Расчёт игры =====================
function calc(){
  if(!season)return null;
  const ids=Object.keys(profiles),td=today(),two=ids.length===2;
  const last=dayAdd(season,SEASON-1),upto=td<last?td:last;
  const by={},tr={},rs={};
  hist.forEach(h=>{by[h.user_id]=by[h.user_id]||{};by[h.user_id][h.day]=by[h.user_id][h.day]||{};by[h.user_id][h.day][h.kind]=Number(h.total)});
  sets.forEach(x=>{tr[x.user_id]=tr[x.user_id]||{};tr[x.user_id][x.day]=true});
  rests.forEach(x=>{rs[x.user_id]=rs[x.user_id]||{};rs[x.user_id][x.day]=true});
  const days=[];
  for(let d=season;d<=upto;d=dayAdd(d,1))days.push(d);
  const val=(id,d,k)=>((by[id]||{})[d]||{})[k]||0;
  const R={};
  ids.forEach(id=>{
    const p=planOf(id),G=goalsList(id),n=G.length;
    const metG=(d,k)=>k==='food'?(val(id,d,'kcal')>0||val(id,d,'protein_g')>0):val(id,d,k)>=p[k];
    const D={};
    days.forEach(d=>{
      const m={};G.forEach(k=>{m[k]=metG(d,k)});
      const done=G.filter(k=>m[k]).length;
      const rest=!!(rs[id]&&rs[id][d]);
      const trained=!!(p.train&&tr[id]&&tr[id][d]);
      const xp=Math.round(60*done/n)+(done===n?20:0)+(trained?30:0);
      D[d]={m,done,rest,trained,xp,good:rest||done>=n-1};
    });
    R[id]={p,G,n,D};
  });
  // Циклы
  const nC=Math.min(CYCLES,Math.ceil(days.length/CYCLE))||1;
  const C=[];
  for(let c=1;c<=nC;c++){
    const cs=dayAdd(season,(c-1)*CYCLE),ce=dayAdd(season,c*CYCLE-1);
    const cd=days.filter(d=>d>=cs&&d<=ce);
    const ended=td>ce,P={};
    ids.forEach(id=>{
      const r=R[id],eff=cd.filter(d=>!r.D[d].rest),per={};
      r.G.forEach(k=>{per[k]=eff.filter(d=>r.D[d].m[k]).length});
      const adh=eff.length?r.G.reduce((a,k)=>a+per[k]/eff.length,0)/r.n:0;
      P[id]={per,eff:eff.length,adh,rests:cd.length-eff.length,
        train:cd.filter(d=>r.D[d].trained).length,
        dayXp:cd.reduce((a,d)=>a+r.D[d].xp,0),
        km:cd.reduce((a,d)=>a+val(id,d,'km'),0)};
    });
    const cnt=(id,k)=>cd.filter(d=>R[id].D[d].rest||R[id].D[d].m[k]).length;
    const hasK=k=>ids.every(id=>R[id].G.includes(k));
    const Q=[];
    if(two){
      if(hasK('water_ml'))Q.push({n:'Водный дозор',d:'Оба выполнили норму воды 7 дней из 10 (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'water_ml'))),tgt:7,xp:50});
      if(hasK('protein_g'))Q.push({n:'Белковый пакт',d:'Оба выполнили норму белка 7 дней из 10 (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'protein_g'))),tgt:7,xp:50});
      Q.push({n:'Летописцы',d:'Оба записывали еду все 10 дней цикла (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'food'))),tgt:10,xp:40});
      const kmT=Math.round(ids.reduce((a,id)=>a+(R[id].p.km||0),0)*CYCLE*0.7);
      if(kmT>0)Q.push({n:'Совместный поход',d:'Вместе пройти '+kmT+' км за цикл',cur:r1(ids.reduce((a,id)=>a+P[id].km,0)),tgt:kmT,xp:50});
    }
    Q.forEach(q=>{q.done=q.cur>=q.tgt});
    const joint=two&&ended&&ids.every(id=>P[id].adh>=0.7);
    ids.forEach(id=>{
      P[id].bonus=ended?Math.round(150*P[id].adh):0;
      P[id].joint=joint?100:0;
      P[id].qxp=Q.filter(q=>q.done).reduce((a,q)=>a+q.xp,0);
      P[id].total=P[id].dayXp+P[id].bonus+P[id].joint+P[id].qxp;
    });
    C.push({c,cs,ce,ended,P,Q,joint,dayIn:cd.length});
  }
  // Квесты сезона
  const S=[];
  if(two){
    const sealed=C.filter(x=>x.ended&&ids.every(id=>x.P[id].adh>=0.7)).length;
    S.push({n:'Семь печатей',d:'Оба держали план на 70%+ в 7 циклах из 9',cur:sealed,tgt:7,xp:300});
    let bst=0,run=0;
    days.forEach(d=>{if(ids.every(id=>R[id].D[d].good)){run++;if(run>bst)bst=run}else run=0});
    S.push({n:'Неразрывная цепь',d:'14 хороших дней подряд у обоих',cur:bst,tgt:14,xp:150});
    const wT=Math.round(ids.reduce((a,id)=>a+(R[id].p.water_ml||0),0)*SEASON*0.8/1000);
    if(wT>0)S.push({n:'Океан',d:'Вместе выпить '+wT+' л воды за сезон',cur:r1(ids.reduce((a,id)=>a+days.reduce((b,d)=>b+val(id,d,'water_ml'),0),0)/1000),tgt:wT,xp:150});
    const kT=Math.round(ids.reduce((a,id)=>a+(R[id].p.km||0),0)*SEASON*0.8);
    if(kT>0)S.push({n:'Дальний путь',d:'Вместе пройти '+kT+' км за сезон',cur:r1(ids.reduce((a,id)=>a+days.reduce((b,d)=>b+val(id,d,'km'),0),0)),tgt:kT,xp:200});
  }
  S.forEach(q=>{q.done=q.cur>=q.tgt});
  const sq=S.filter(q=>q.done).reduce((a,q)=>a+q.xp,0);
  ids.forEach(id=>{
    const r=R[id];
    let xp=days.reduce((a,d)=>a+r.D[d].xp,0);
    C.forEach(x=>{xp+=x.P[id].bonus+x.P[id].joint+x.P[id].qxp});
    xp+=sq;
    let d=upto;if(!(r.D[d]&&r.D[d].good))d=dayAdd(d,-1);
    let st=0;while(d>=season&&r.D[d]&&r.D[d].good){st++;d=dayAdd(d,-1)}
    Object.assign(r,{xp,streak:st},lvlOf(xp));
  });
  const curDay=dayDiff(season,td)+1;
  return {R,C,S,days,curDay,over:td>last,ids,two,curC:Math.min(CYCLES,Math.ceil(curDay/CYCLE))};
}
function checkCycleEnd(){
  if(!season)return;
  const G=calc();
  const ended=G.C.filter(x=>x.ended).map(x=>x.c);
  const lastE=ended.length?Math.max(...ended):0;
  let seen=0;
  try{seen=Number(localStorage.getItem('seenCycle_'+me.id))||0}catch(e){}
  if(lastE>seen){
    newCycle=lastE;viewId='log';
    try{localStorage.setItem('seenCycle_'+me.id,String(lastE))}catch(e){}
  }
}

// ===================== Экран =====================
function render(){
  const G=season?calc():null;
  if(!G&&(viewId==='q'||viewId==='log'))viewId=me.id;
  const tabs=$('tabs');tabs.innerHTML='';
  const tab=(id,label)=>{const b=mk('button',label,id===viewId?'tab on':'tab');b.onclick=()=>{viewId=id;if(id!=='log')newCycle=0;render()};tabs.appendChild(b)};
  Object.keys(profiles).sort((a,b)=>a===me.id?-1:b===me.id?1:0).forEach(id=>tab(id,profiles[id].name+(id===me.id?' (я)':'')));
  if(G){tab('q','Квесты');tab('log','Летопись')}
  const box=$('cards');box.innerHTML='';
  box.appendChild(G?headCard(G):startCard());
  if(viewId==='q'){renderQuests(box,G);return}
  if(viewId==='log'){renderLog(box,G);return}
  const own=viewId===me.id;
  if(G)box.appendChild(levelCard(G,viewId));
  const canStr=planOf(viewId).train&&(own||profiles[me.id].show_partner_strength!==false);
  if(!canStr)sub='sum';
  if(canStr){
    const b=mk('div','','tabs');
    [['sum','Сводка'],['str','Силовые']].forEach(([k,n])=>{const x=mk('button',n,sub===k?'tab on':'tab');x.onclick=()=>{sub=k;render()};b.appendChild(x)});
    box.appendChild(b);
  }
  if(sub==='str'){renderStrength(box,own);return}
  const p=planOf(viewId);
  M.forEach(m=>{
    const v=sum(viewId,m.k),g=m.k==='kcal'?0:(p[m.k]||0);
    const c=mk('div','','card'),h=mk('div','','row');
    h.append(mk('b',m.t),mk('span',r1(v)+(g?' / '+g:'')+' '+m.u));
    c.appendChild(h);
    if(g)c.appendChild(bar(v,g,v>=g?'var(--green)':''));
    if(own){
      const ctl=mk('div','','ctl');
      m.quick.forEach(q=>{const b=mk('button','+'+q);b.onclick=()=>add(m.k,q);ctl.appendChild(b)});
      const inp=mk('input');inp.type='text';inp.inputMode='decimal';inp.placeholder=m.u;
      const b=mk('button','Добавить');b.onclick=()=>add(m.k,parseFloat(inp.value.replace(',','.')));
      const u=mk('button','↩','ghost');u.title='Отменить последнее';u.onclick=()=>undo(m.k);
      ctl.append(inp,b,u);c.appendChild(ctl);
    }
    box.appendChild(c);
  });
  if(G&&!G.over){const rc=restCard(G,own);if(rc)box.appendChild(rc)}
  box.appendChild(throneCard(own));
  const sc=settingsCard();if(sc)box.appendChild(sc);
}
function startCard(){
  const c=mk('div','','card head');
  c.appendChild(mk('b','Сезон ещё не начат','gold'));
  c.appendChild(mk('div','90 дней, 9 циклов по 10 дней. Отсчёт пойдёт для вас обоих с дня нажатия. Записи можно вести и до старта, но опыт начнёт копиться только с первого дня сезона.','sub mt'));
  const b=mk('button','Начать','big mt');b.onclick=startSeason;c.appendChild(b);
  return c;
}
async function startSeason(){
  if(!confirm('Начать сезон? 90 дней пойдут с сегодняшнего дня для вас обоих.'))return;
  const {error}=await db.from('season').insert({id:1,start_day:today()});
  if(error&&!/duplicate/i.test(error.message)){alert('Ошибка: '+error.message);return}
  viewId=me.id;refresh();
}
function headCard(G){
  const c=mk('div','','card head');
  if(G.over){
    c.appendChild(mk('b','Сезон завершён!','gold'));
    c.appendChild(mk('div','Все 90 дней позади. Итоги в Летописи.','sub mt'));
  }else{
    const k=G.curDay-(G.curC-1)*CYCLE;
    c.appendChild(mk('b','День '+G.curDay+' из '+SEASON+': выживание','gold'));
    c.appendChild(mk('div','Цикл '+G.curC+' из '+CYCLES+' · день '+k+' из '+CYCLE,'sub mt'));
    c.appendChild(bar(G.curDay,SEASON,'var(--gold)'));
  }
  return c;
}
function levelCard(G,id){
  const r=G.R[id],c=mk('div','','card');
  if(!r)return c;
  const h=mk('div','','row');
  h.append(mk('b','Ур. '+r.lvl+' · '+r.title),mk('span',r.xp+' XP'));
  c.appendChild(h);
  c.appendChild(bar(r.xp-r.lo,r.hi-r.lo||1,'var(--gold)'));
  c.appendChild(mk('div',r.lvl<MAXLVL?'До уровня '+(r.lvl+1)+': '+(r.hi-r.xp)+' XP':'Максимальный уровень сезона','sub'));
  c.appendChild(mk('div','Серия хороших дней: '+r.streak,'sub'));
  const d=r.D[today()];
  if(d&&!G.over){
    if(d.rest)c.appendChild(mk('div','Сегодня привал: серия не прервётся','sub ok mt'));
    const line=mk('div','','sub mt');
    const per=Math.round(60/r.n);
    line.textContent='Сегодня: '+r.G.map(k=>(d.m[k]?'✓ ':'· ')+GL[k]+' +'+per).join('   ')+(d.done===r.n?'   ✓ Все цели +20':'   (все цели: ещё +20)')+(r.p.train?(d.trained?'   ✓ Тренировка +30':'   · Тренировка +30'):'');
    c.appendChild(line);
  }
  return c;
}
function restCard(G,own){
  if(!G.R[viewId])return null;
  const td=today(),cs=dayAdd(season,(G.curC-1)*CYCLE),ce=dayAdd(season,G.curC*CYCLE-1);
  const mine=rests.filter(x=>x.user_id===viewId&&x.day>=cs&&x.day<=ce).map(x=>x.day).sort();
  const c=mk('div','','card'),h=mk('div','','row');
  h.append(mk('b','Привал (читмил)'),mk('span',mine.length+' / '+REST));
  c.appendChild(h);
  c.appendChild(mk('div','День без давления плана: серия не прерывается, а в итогах цикла этот день не учитывается. С новым циклом счётчик обнуляется.','sub'));
  mine.forEach(d=>{
    const row=mk('div','','row mt');
    row.appendChild(mk('span',(d===td?'Сегодня, ':'')+fmt(d)));
    if(own&&d>=td){const x=mk('button','✕','x');x.title='Отменить';x.onclick=()=>delRest(d);row.appendChild(x)}
    c.appendChild(row);
  });
  if(own&&mine.length<REST){
    if(!mine.includes(td)){const b=mk('button','Привал сегодня','mt');b.onclick=()=>addRest(td);c.appendChild(b)}
    if(td<ce){
      const ctl=mk('div','','ctl mt');
      const inp=mk('input');inp.type='date';inp.min=dayAdd(td,1);inp.max=ce;
      const b=mk('button','Запланировать');
      b.onclick=()=>{if(!inp.value){alert('Выбери дату');return}addRest(inp.value)};
      ctl.append(inp,b);c.appendChild(ctl);
    }
  }
  return c;
}
async function addRest(d){
  const G=calc(),cs=dayAdd(season,(G.curC-1)*CYCLE),ce=dayAdd(season,G.curC*CYCLE-1);
  if(d<today()||d<cs||d>ce){alert('Привал можно поставить только на сегодня или на будущий день текущего цикла');return}
  if(rests.filter(x=>x.user_id===me.id&&x.day>=cs&&x.day<=ce).length>=REST){alert('В этом цикле привалы закончились');return}
  const {error}=await db.from('cheat_days').insert({day:d});
  if(error&&!/duplicate/i.test(error.message)){alert('Ошибка: '+error.message);return}
  refresh();
}
async function delRest(d){
  const {error}=await db.from('cheat_days').delete().eq('user_id',me.id).eq('day',d);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
function throneCard(own){
  const v=sum(viewId,'toilet'),c=mk('div','','card'),h=mk('div','','row');
  h.append(mk('b','🚽 Трон'),mk('span',v+' раз сегодня'));
  c.appendChild(h);
  c.appendChild(mk('div',THRONE.find(t=>v>=t[0])[1]+' · опыта не даёт, чисто для истории','sub'));
  if(own){
    const ctl=mk('div','','ctl');
    const b=mk('button','+1');b.onclick=()=>add('toilet',1);
    const u=mk('button','↩','ghost');u.onclick=()=>undo('toilet');
    ctl.append(b,u);c.appendChild(ctl);
  }
  return c;
}
function settingsCard(){
  if(viewId!==me.id||planOf(me.id).train)return null;
  const partner=Object.keys(profiles).find(id=>id!==me.id&&planOf(id).train);
  if(!partner)return null;
  const c=mk('div','','card');
  c.appendChild(mk('b','Настройки'));
  const l=mk('label','','chk'),i=mk('input');
  i.type='checkbox';i.checked=profiles[me.id].show_partner_strength!==false;
  i.onchange=async()=>{
    const {error}=await db.from('profiles').update({show_partner_strength:i.checked}).eq('user_id',me.id);
    if(error){alert('Ошибка: '+error.message);return}
    refresh();
  };
  l.append(i,'Показывать силовые: '+profiles[partner].name);
  c.appendChild(l);
  return c;
}
function questCard(q){
  const c=mk('div','','card'),h=mk('div','','row');
  h.append(mk('b',(q.done?'✓ ':'')+q.n,q.done?'ok':''),mk('span','+'+q.xp+' XP каждому'));
  c.append(h,mk('div',q.d,'sub'));
  c.appendChild(bar(Math.min(q.cur,q.tgt),q.tgt,q.done?'var(--green)':''));
  c.appendChild(mk('div',Math.min(q.cur,q.tgt)+' / '+q.tgt,'sub'));
  return c;
}
function renderQuests(box,G){
  if(!G.two){box.appendChild(mk('div','Квесты заработают, когда в приложении будут оба профиля','sub'));return}
  box.appendChild(mk('b','Квесты сезона','gold'));
  G.S.forEach(q=>box.appendChild(questCard(q)));
  const cur=G.C[G.C.length-1];
  box.appendChild(mk('b','Квесты цикла '+cur.c+(cur.ended?' (завершён)':''),'gold'));
  cur.Q.forEach(q=>box.appendChild(questCard(q)));
  box.appendChild(mk('div','Игровой день идёт с 12:00 до 12:00. Цели дня: вода, белок, километры и запись еды, каждая +15 XP, за все сразу ещё +20, тренировка +30 XP. Хороший день: выполнены все цели или все кроме одной, либо привал. В конце цикла бонус до 150 XP за выполнение плана и +100 каждому, если оба держали план на 70%+. Максимальный уровень: '+MAXLVL+'.','sub mt'));
}
function renderLog(box,G){
  if(newCycle){
    const b=mk('div','','card banner');
    b.appendChild(mk('b','Цикл '+newCycle+' завершён! Итоги ниже.','gold'));
    box.appendChild(b);
  }
  const ids=G.ids.slice().sort((a,b)=>a===me.id?-1:b===me.id?1:0);
  G.C.slice().reverse().forEach(x=>{
    const c=mk('div','','card'),h=mk('div','','row');
    h.append(mk('b','Цикл '+x.c+' · '+fmt(x.cs)+'–'+fmt(x.ce)),mk('span',x.ended?'завершён':'идёт, день '+x.dayIn+' из '+CYCLE,'sub'));
    c.appendChild(h);
    const prev=G.C[x.c-2];
    ids.forEach(id=>{
      const P=x.P[id],r=G.R[id],blk=mk('div','','mt');
      let cmp='';
      if(prev){const dd=Math.round((P.adh-prev.P[id].adh)*100);cmp=dd>0?' ▲'+dd:dd<0?' ▼'+(-dd):' ='}
      blk.appendChild(mk('b',profiles[id].name+': план выполнен на '+pct(P.adh)+(x.ended?'':' (пока)')+cmp));
      blk.appendChild(bar(P.adh,1,P.adh>=0.7?'var(--green)':''));
      blk.appendChild(mk('div',r.G.map(k=>GL[k]+' '+P.per[k]+'/'+P.eff).join(' · '),'sub'));
      const extra=[];
      if(r.p.train)extra.push('Тренировок: '+P.train);
      extra.push('Привалов: '+P.rests);
      blk.appendChild(mk('div',extra.join(' · '),'sub'));
      let xpl='XP за цикл: '+P.total+' (дни '+P.dayXp;
      if(P.qxp)xpl+=', квесты +'+P.qxp;
      if(x.ended)xpl+=', итоги +'+P.bonus;
      if(P.joint)xpl+=', совместный +'+P.joint;
      blk.appendChild(mk('div',xpl+')','sub'));
      c.appendChild(blk);
    });
    if(x.ended&&G.two){
      const [a,b]=ids,pa=x.P[a].adh,pb=x.P[b].adh;
      const lead=pa===pb?'Ничья: оба держали план одинаково':'Лучше держал план: '+profiles[pa>pb?a:b].name;
      c.appendChild(mk('div',lead,'sub mt'));
      c.appendChild(mk('div',x.joint?'✓ Совместный бонус: +100 XP каждому':'Совместный бонус не взят (нужно 70%+ у обоих)',x.joint?'sub ok':'sub'));
    }
    const qd=x.Q.filter(q=>q.done);
    if(qd.length)c.appendChild(mk('div','Квесты: '+qd.map(q=>'✓ '+q.n).join(', '),'sub ok mt'));
    box.appendChild(c);
  });
}
function renderStrength(box,own){
  const mine=sets.filter(s=>s.user_id===viewId);
  if(own){
    const c=mk('div','','card');
    const dl=mk('datalist');dl.id='ex';
    [...new Set(mine.map(s=>s.exercise))].forEach(n=>{const o=mk('option');o.value=n;dl.appendChild(o)});
    const ex=mk('input');ex.setAttribute('list','ex');ex.placeholder='Упражнение';
    const w=mk('input');w.inputMode='decimal';w.placeholder='Вес, кг (0 если без веса)';
    const r=mk('input');r.inputMode='numeric';r.placeholder='Повторы';
    const b=mk('button','+ Подход');
    b.onclick=()=>addSet(ex.value,parseFloat((w.value||'0').replace(',','.')),parseInt(r.value));
    c.append(dl,ex,w,r,b);box.appendChild(c);
  }
  const t=mine.filter(s=>s.day===today());
  const c1=mk('div','','card');
  c1.appendChild(mk('b','Сегодня'));
  if(!t.length)c1.appendChild(mk('div','Пока пусто','sub mt'));
  t.forEach(s=>{
    const row=mk('div','','row mt');
    row.appendChild(mk('span',s.exercise+': '+Number(s.weight)+' кг × '+s.reps));
    if(own){const x=mk('button','✕','x');x.onclick=()=>delSet(s.id);row.appendChild(x)}
    c1.appendChild(row);
  });
  box.appendChild(c1);
  const g={};
  mine.forEach(s=>{(g[s.exercise]=g[s.exercise]||[]).push(s)});
  const c2=mk('div','','card');
  c2.appendChild(mk('b','Прогресс'));
  if(!Object.keys(g).length)c2.appendChild(mk('div','Здесь появятся рекорды','sub mt'));
  Object.keys(g).sort().forEach(n=>{
    const a=g[n];
    const best=a.reduce((x,y)=>(Number(y.weight)>Number(x.weight)||(Number(y.weight)===Number(x.weight)&&y.reps>x.reps))?y:x);
    const days=[...new Set(a.map(s=>s.day))].sort();
    const top=d=>Math.max(...a.filter(s=>s.day===d).map(s=>Number(s.weight)));
    const last=days[days.length-1],prev=days[days.length-2];
    let tr='';
    if(prev!==undefined){const d=top(last)-top(prev);tr=d>0?' ▲':d<0?' ▼':' =';}
    const blk=mk('div','','mt');
    blk.appendChild(mk('div',n));
    blk.appendChild(mk('div','Рекорд: '+Number(best.weight)+' кг × '+best.reps,'sub'));
    blk.appendChild(mk('div','Последний раз '+fmt(last)+': макс. '+top(last)+' кг'+tr,'sub'));
    c2.appendChild(blk);
  });
  box.appendChild(c2);
}
async function addSet(ex,w,r){
  ex=ex.trim();ex=ex.charAt(0).toUpperCase()+ex.slice(1);
  if(!ex||isNaN(w)||w<0||!(r>0)){alert('Заполни упражнение, вес и повторы');return}
  const {error}=await db.from('sets').insert({exercise:ex,weight:w,reps:r,day:today()});
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function delSet(id){
  const {error}=await db.from('sets').delete().eq('id',id);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function add(k,v){
  if(!(v>0)){alert('Введи число больше нуля');return}
  const {error}=await db.from('entries').insert({kind:k,value:v,day:today()});
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function undo(k){
  const mine=rows.filter(r=>r.user_id===me.id&&r.kind===k);
  if(!mine.length)return;
  const {error}=await db.from('entries').delete().eq('id',mine[mine.length-1].id);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)refresh()});
let lastDay=today();
setInterval(()=>{const t=today();if(t!==lastDay){lastDay=t;if(me)refresh()}},60000);
init();
</script>
</body></html>
