async function loadAll(table,orders){
  let all=[],from=0;
  while(true){
    let q=db.from(table).select('*');
    orders.forEach(o=>{q=q.order(o)});
    const {data,error}=await q.range(from,from+999);
    if(error)throw error;
    all=all.concat(data);
    if(data.length<1000)break;
    from+=1000;
  }
  return all;
}

function calc(){
  if(!season)return null;
  const ids=Object.keys(profiles),td=today(),two=ids.length===2;
  const last=dayAdd(season,SEASON-1),upto=td<last?td:last;
  const by={},tr={},rs={};
  hist.forEach(h=>{by[h.user_id]=by[h.user_id]||{};by[h.user_id][h.day]=by[h.user_id][h.day]||{};by[h.user_id][h.day][h.kind]=Number(h.total)});
  wl.forEach(x=>{tr[x.user_id]=tr[x.user_id]||{};tr[x.user_id][x.day]=(tr[x.user_id][x.day]||0)+1});
  rests.forEach(x=>{rs[x.user_id]=rs[x.user_id]||{};rs[x.user_id][x.day]=true});
  const days=[];
  for(let d=season;d<=upto;d=dayAdd(d,1))days.push(d);
  const val=(id,d,k)=>((by[id]||{})[d]||{})[k]||0;
  const R={};
  ids.forEach(id=>{
    const p=planOf(id),G=goalsList(id),n=G.length;
    const metG=(d,k)=>k==='food'?(val(id,d,'kcal')>0||val(id,d,'protein_g')>0):val(id,d,k)>=p[k];
    const D={};
    days.forEach(d=>{
      const m={};G.forEach(k=>{m[k]=metG(d,k)});
      const done=G.filter(k=>m[k]).length;
      const rest=!!(rs[id]&&rs[id][d]);
      const pt=p.train?PROGRAM[progDayOf(d)-1].ex.length:0;
      const pd=pt?Math.min(pt,(tr[id]&&tr[id][d])||0):0;
      const trained=pt>0&&pd===pt;
      const xp=Math.round(60*done/n)+(done===n?20:0)+(pt?Math.round(30*pd/pt):0);
      D[d]={m,done,rest,trained,pt,pd,xp,good:rest||done>=n-1};
    });
    R[id]={p,G,n,D};
  });
  // Циклы
  const nC=Math.min(CYCLES,Math.ceil(days.length/CYCLE))||1;
  const C=[];
  for(let c=1;c<=nC;c++){
    const cs=dayAdd(season,(c-1)*CYCLE),ce=dayAdd(season,c*CYCLE-1);
    const cd=days.filter(d=>d>=cs&&d<=ce);
    const ended=td>ce,P={};
    ids.forEach(id=>{
      const r=R[id],eff=cd.filter(d=>!r.D[d].rest),per={};
      r.G.forEach(k=>{per[k]=eff.filter(d=>r.D[d].m[k]).length});
      const adh=eff.length?r.G.reduce((a,k)=>a+per[k]/eff.length,0)/r.n:0;
      P[id]={per,eff:eff.length,adh,rests:cd.length-eff.length,
        train:cd.filter(d=>r.D[d].trained).length,trainPlan:cd.filter(d=>r.D[d].pt>0).length,
        dayXp:cd.reduce((a,d)=>a+r.D[d].xp,0),
        km:cd.reduce((a,d)=>a+val(id,d,'km'),0)};
    });
    const cnt=(id,k)=>cd.filter(d=>R[id].D[d].rest||R[id].D[d].m[k]).length;
    const hasK=k=>ids.every(id=>R[id].G.includes(k));
    const Q=[];
    if(two){
      if(hasK('water_ml'))Q.push({n:'Источник маны',d:'Оба наполнили ману до нормы 7 дней из 10 (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'water_ml'))),tgt:7,xp:50});
      if(hasK('protein_g'))Q.push({n:'Пакт плоти',d:'Оба собрали норму эссенции плоти 7 дней из 10 (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'protein_g'))),tgt:7,xp:50});
      Q.push({n:'Летописцы пира',d:'Оба вносили трапезы в летопись все 10 дней главы (привал засчитывается)',cur:Math.min(...ids.map(id=>cnt(id,'food'))),tgt:10,xp:40});
      const kmT=Math.round(ids.reduce((a,id)=>a+(R[id].p.km||0),0)*CYCLE*0.7);
      if(kmT>0)Q.push({n:'Странствие вдвоём',d:'Вместе пройти '+kmT+' км за главу',cur:r1(ids.reduce((a,id)=>a+P[id].km,0)),tgt:kmT,xp:50});
    }
    Q.forEach(q=>{q.done=q.cur>=q.tgt});
    const joint=two&&ended&&ids.every(id=>P[id].adh>=0.7);
    ids.forEach(id=>{
      P[id].bonus=ended?Math.round(150*P[id].adh):0;
      P[id].joint=joint?100:0;
      P[id].qxp=Q.filter(q=>q.done).reduce((a,q)=>a+q.xp,0);
      P[id].total=P[id].dayXp+P[id].bonus+P[id].joint+P[id].qxp;
    });
    C.push({c,cs,ce,ended,P,Q,joint,dayIn:cd.length});
  }
  // Квесты сезона
  const S=[];
  if(two){
    const sealed=C.filter(x=>x.ended&&ids.every(id=>x.P[id].adh>=0.7)).length;
    S.push({n:'Семь печатей',d:'Оба держали клятву на 70%+ в 7 главах из 9',cur:sealed,tgt:7,xp:300});
    let bst=0,run=0;
    days.forEach(d=>{if(ids.every(id=>R[id].D[d].good)){run++;if(run>bst)bst=run}else run=0});
    S.push({n:'Нерушимая цепь',d:'14 достойных дней подряд у обоих',cur:bst,tgt:14,xp:150});
    const wT=Math.round(ids.reduce((a,id)=>a+(R[id].p.water_ml||0),0)*SEASON*0.8/1000);
    if(wT>0)S.push({n:'Океан маны',d:'Вместе испить '+wT+' л маны за испытание',cur:r1(ids.reduce((a,id)=>a+days.reduce((b,d)=>b+val(id,d,'water_ml'),0),0)/1000),tgt:wT,xp:150});
    const kT=Math.round(ids.reduce((a,id)=>a+(R[id].p.km||0),0)*SEASON*0.8);
    if(kT>0)S.push({n:'Дальний путь',d:'Вместе пройти '+kT+' км за испытание',cur:r1(ids.reduce((a,id)=>a+days.reduce((b,d)=>b+val(id,d,'km'),0),0)),tgt:kT,xp:200});
  }
  S.forEach(q=>{q.done=q.cur>=q.tgt});
  const sq=S.filter(q=>q.done).reduce((a,q)=>a+q.xp,0);
  ids.forEach(id=>{
    const r=R[id];
    let xp=days.reduce((a,d)=>a+r.D[d].xp,0);
    C.forEach(x=>{xp+=x.P[id].bonus+x.P[id].joint+x.P[id].qxp});
    xp+=sq;
    let d=upto;if(!(r.D[d]&&r.D[d].good))d=dayAdd(d,-1);
    let st=0;while(d>=season&&r.D[d]&&r.D[d].good){st++;d=dayAdd(d,-1)}
    Object.assign(r,{xp,streak:st},lvlOf(xp));
  });
  const curDay=dayDiff(season,td)+1;
  return {R,C,S,days,curDay,over:td>last,ids,two,curC:Math.min(CYCLES,Math.ceil(curDay/CYCLE))};
}
function checkCycleEnd(){
  if(!season)return;
  const G=calcMemo();
  const ended=G.C.filter(x=>x.ended).map(x=>x.c);
  const lastE=ended.length?Math.max(...ended):0;
  let seen=seenMem;
  try{seen=Math.max(seen,Number(localStorage.getItem('seenCycle_'+me.id))||0)}catch(e){}
  if(lastE>seen){
    newCycle=lastE;page='log';sfx('chapter');
    seenMem=lastE;
    try{localStorage.setItem('seenCycle_'+me.id,String(lastE))}catch(e){}
  }
}

  if(r.note)c.appendChild(mk('div',r.note,'sub mt'));
  c.appendChild(mk('div','Это лишь предсказание алхимика: если знаешь точнее, поправь цифры перед записью.','sub mt'));
  const ctl=mk('div','','ctl mt');
  const ok=mk('button','Внести в летопись');ok.disabled=scan.busy;
  ok.onclick=()=>saveScan(parseFloat(kI.value.replace(',','.'))||0,parseFloat(pI.value.replace(',','.'))||0);
  const again=mk('button','Заново','ghost');again.onclick=()=>{scan.res=null;render()};
  ctl.append(ok,again);c.appendChild(ctl);
  if(scan.err)c.appendChild(mk('div',scan.err,'err mt'));
  return c;
}
function resizeImage(file){
  return new Promise((ok,bad)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,1024/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        ok(cv.toDataURL('image/jpeg',0.8));
      };
      im.onerror=()=>bad(new Error('Не удалось открыть фото, попробуй другое'));
      im.src=fr.result;
    };
    fr.onerror=()=>bad(new Error('Не удалось прочитать фото'));
    fr.readAsDataURL(file);
  });
}
async function doScan(){
  if(scan.busy)return;
  if(!scan.img&&!scan.text.trim()){scan.err='Добавь фото или описание';render();return}
  scan.busy=true;scan.err='';render();
  let data=null,msg='';
  try{
    let timer;
    const r=await Promise.race([
      db.functions.invoke('food-scan',{body:{image:scan.img?scan.img.split(',')[1]:null,mime:'image/jpeg',text:scan.text.trim().slice(0,1000)}}),
      new Promise((_,bad)=>{timer=setTimeout(()=>bad(new Error('алхимик не ответил за 60 секунд, попробуй ещё раз')),60000)})
    ]).finally(()=>clearTimeout(timer));
    if(r.error){
      msg=r.error.message;
      try{const j=await r.error.context.json();if(j&&j.error)msg=j.error}catch(e){}
    }else data=r.data;
  }catch(e){msg=e.message||String(e)}
  scan.busy=false;
  if(!msg&&data&&data.error)msg=data.error;
  if(msg||!data){scan.err='Ошибка: '+(msg||'пустой ответ');render();return}
  scan.res=data;render();
}
function saveScan(k,p){const d=selDay();return serial(()=>saveScan_(k,p,d))}
async function saveScan_(k,p,day){
  if(scan.busy)return;
  const list=[{kind:'kcal',value:k,day},{kind:'protein_g',value:p,day}].filter(x=>x.value>0&&isFinite(x.value));
  if(!list.length){alert('Нечего записывать: обе цифры нулевые');return}
  scan.busy=true;render();
  const {error}=await db.from('entries').insert(list);
  scan.busy=false;
  if(error){scan.err='Ошибка: '+error.message;render();return}
  scanReset();refresh();
}

let restPlan=false;
function restCard(G,own){
  if(!G.R[viewId])return null;
  const td=today(),cs=dayAdd(season,(G.curC-1)*CYCLE),ce=dayAdd(season,G.curC*CYCLE-1);
  const mine=rests.filter(x=>x.user_id===viewId&&x.day>=cs&&x.day<=ce).map(x=>x.day).sort();
  const c=mk('div','','card'),r=mk('div','','restline');
  const left=mk('div');left.appendChild(mk('b','Привал у костра'));
  left.appendChild(mk('div','Осталось '+(REST-mine.length)+' из '+REST+' в этой главе','sub'));
  r.appendChild(left);
  if(own&&mine.length<REST&&!mine.includes(td)){const b=mk('button','Сегодня');b.onclick=()=>addRest(td);r.appendChild(b)}
  c.appendChild(r);
  if(mine.length){
    const ch=mk('div','','chips mt');
    mine.forEach(d=>{
      const x=mk('button',(d===td?'сегодня ':'')+fmt(d)+(own&&d>=td?'  ✕':''),'ghost');
      if(own&&d>=td){x.title='Отменить привал';x.onclick=()=>delRest(d)}else x.disabled=true;
      ch.appendChild(x);
    });
    c.appendChild(ch);
  }
  if(own&&mine.length<REST&&td<ce){
    if(!restPlan){const l=mk('button','Запланировать на другой день','linkbtn');l.onclick=()=>{restPlan=true;render()};c.appendChild(l)}
    else{
      const ctl=mk('div','','ctl mt');
      const inp=mk('input');inp.type='date';inp.min=dayAdd(td,1);inp.max=ce;
      const b=mk('button','Запланировать');
      b.onclick=()=>{if(!inp.value){alert('Выбери дату');return}restPlan=false;addRest(inp.value)};
      ctl.append(inp,b);c.appendChild(ctl);
    }
  }
  c.appendChild(mk('div','В день привала цепь не рвётся, а итоги главы его не учитывают.','sub mt'));
  return c;
}
function addRest(d){return serial(()=>addRest_(d))}
async function addRest_(d){
  const G=calcMemo(),cs=dayAdd(season,(G.curC-1)*CYCLE),ce=dayAdd(season,G.curC*CYCLE-1);
  if(d<today()||d<cs||d>ce){alert('Привал можно разбить только сегодня или в будущий день текущей главы');return}
  const {data:used,error:e1}=await db.from('cheat_days').select('day').eq('user_id',me.id).gte('day',cs).lte('day',ce);
  if(e1){alert('Ошибка: '+e1.message);return}
  if((used||[]).some(x=>x.day===d)){refresh();return}
  if((used||[]).length>=REST){alert('В этой главе привалы закончились');return}
  const {error}=await db.from('cheat_days').insert({day:d});
  if(error&&!/duplicate/i.test(error.message)){alert('Ошибка: '+error.message);return}
  refresh();
}
function delRest(d){return serial(()=>delRest_(d))}
async function delRest_(d){
  const {error}=await db.from('cheat_days').delete().eq('user_id',me.id).eq('day',d);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}

  box.appendChild(moodChart());
  if(newCycle){

function renderStrength(box,own,uid){
  const td=selDay(),cur=progDayOf(td);

  for(let i=1;i<=CYCLE;i++){
    const b=mk('button',String(i),i===pdN?'tab on':'tab');
    
    if(i===cur)b.style.borderColor='var(--gold)';

  }
  c.appendChild(nav);
  if(!season)c.appendChild(mk('div','Испытание не началось: пока показан день 1. После старта день кузни идёт вместе с главой.','sub mt'));

  const lastW=name=>{const a=wl.filter(x=>x.user_id===uid&&x.exercise===name&&Number(x.weight)>0);return a.length?Number(a[a.length-1].weight):''};
  P.ex.forEach(([name,scheme],i)=>{
    const row=mk('div','','row mt');row.style.alignItems='center';
    const left=mk('div');

    left.appendChild(mk('div',(done?'✓ ':'')+name,done?'ok':''));
    left.appendChild(mk('div',scheme,'sub'));
    row.appendChild(left);
    if(isToday&&own){
      const right=mk('div','','ctl');right.style.flexWrap='nowrap';
      const w=mk('input');w.inputMode='decimal';w.placeholder='кг';w.style.width='64px';w.style.minWidth='64px';
      w.value=done&&done.weight!=null?Number(done.weight):lastW(name);
      const cb=mk('input');cb.type='checkbox';cb.checked=!!done;cb.style.width='26px';cb.style.height='26px';
      cb.onchange=()=>markEx(i,name,cb.checked,w.value);
      w.onchange=()=>{if(cb.checked)markEx(i,name,true,w.value)};
      right.append(w,cb);row.appendChild(right);
    }
    c.appendChild(row);
  });

  PROGRAM_RULES.forEach(t=>rc.appendChild(mk('div','· '+t,'sub mt')));
  box.appendChild(rc);

  wl.filter(x=>x.user_id===uid&&Number(x.weight)>0).forEach(x=>{(g[x.exercise]=g[x.exercise]||[]).push(x)});

function markEx(i,name,on,wv){const d=selDay();return serial(()=>markEx_(i,name,on,wv,d))}
async function markEx_(i,name,on,wv,day){
  let error;
  if(on){
    const w=parseFloat(String(wv||'').replace(',','.'));
    sfx('forge');
    ({error}=await db.from('workout_log').upsert({user_id:me.id,day,ex_idx:i,exercise:name,weight:w>0?w:null},{onConflict:'user_id,day,ex_idx'}));
  }else{
    ({error}=await db.from('workout_log').delete().eq('user_id',me.id).eq('day',day).eq('ex_idx',i));
  }
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
function add(k,v){const d=selDay();return serial(()=>add_(k,v,d))}
async function add_(k,v,day){
  if(!(v>0)||!isFinite(v)){alert('Введи число больше нуля');return}
  if(LIMITS[k]&&v>LIMITS[k]&&!confirm('Записать '+v+' за раз? Похоже на опечатку.'))return;
  const {error}=await db.from('entries').insert({kind:k,value:v,day});
  if(error){alert('Ошибка: '+error.message);return}
  sfx(k==='water_ml'?'drop':'add');
  refresh();
}
function undo(k){const d=selDay();return serial(()=>undo_(k,d))}
async function undo_(k,day){
  const {data:last,error:e1}=await db.from('entries').select('id').eq('user_id',me.id).eq('kind',k).eq('day',day).order('id',{ascending:false}).limit(1);
  if(e1){alert('Ошибка: '+e1.message);return}
  if(!last||!last.length)return;
  const {error}=await db.from('entries').delete().eq('id',last[0].id);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
