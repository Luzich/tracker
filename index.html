<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1412">
<title>Выживание</title>
<style>
:root{--bg:#1a1412;--card:#2a201b;--line:#5a4632;--gold:#d4a84b;--txt:#eadfc8;--red:#b23a3a;--blue:#3a7bd5}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Georgia,serif}
body{padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0);max-width:480px;margin:0 auto}
h1{font-size:20px;text-align:center;color:var(--gold);margin:16px 0}
section{display:none}
section.on{display:block}
input,button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0}
input{width:100%}
button{cursor:pointer}
.tabs{display:flex;gap:8px}
.tab{flex:1}
.tab.on{background:var(--red);border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between}
.bar{height:10px;background:#120d0b;border-radius:5px;margin:8px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.ctl{display:flex;gap:6px;align-items:center}
.ctl input{flex:1;min-width:0}
.ghost{background:none}
.err{color:#e57373;min-height:20px}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:block;margin:8px 0}
.mt{margin-top:8px}
.sub{opacity:.7;font-size:14px}
.x{background:none;border:none;padding:2px 8px}
</style></head><body>
<h1>⚔ Выживание</h1>

<section id="login">
  <input id="email" type="email" placeholder="Почта" autocomplete="username">
  <input id="pass" type="password" placeholder="Пароль" autocomplete="current-password">
  <button onclick="login()">Войти</button>
  <div class="err" id="err"></div>
</section>

<section id="name">
  <p>Как тебя зовут в приложении?</p>
  <input id="nm" type="text" placeholder="Имя">
  <button onclick="saveName()">Сохранить</button>
</section>

<section id="app">
  <div class="tabs" id="tabs"></div>
  <div id="cards"></div>
  <button class="ghost" onclick="logout()">Выйти</button>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const SB_URL='https://dxhsbbafmjwnamquzbjz.supabase.co';
const SB_KEY='sb_publishable_XSjCHnz2HQ6Uh-z62TIvcg_xwuuzo-f';
// Дневные нормы. Потом сделаем настраиваемыми.
const GOALS={water_ml:2500,kcal:2000,protein_g:100,km:7};
const M=[
 {k:'water_ml',t:'Вода',u:'мл',quick:[250,500]},
 {k:'kcal',t:'Ккал',u:'ккал',quick:[]},
 {k:'protein_g',t:'Белок',u:'г',quick:[]},
 {k:'km',t:'Километры',u:'км',quick:[]},
 {k:'toilet',t:'Туалет',u:'раз',quick:[1]}
];
const db=supabase.createClient(SB_URL,SB_KEY);
let me=null,profiles={},viewId=null,rows=[],sets=[],sub='sum';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function show(id){['login','name','app'].forEach(s=>$(s).classList.toggle('on',s===id))}

async function init(){
  const {data:{session}}=await db.auth.getSession();
  if(!session){show('login');return}
  me=session.user;
  await loadProfiles();
  if(!profiles[me.id]){show('name');return}
  viewId=me.id;
  show('app');
  await refresh();
}
async function login(){
  $('err').textContent='';
  const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  if(error){$('err').textContent='Не вышло: '+error.message;return}
  init();
}
async function logout(){await db.auth.signOut();me=null;show('login')}
async function saveName(){
  const n=$('nm').value.trim();
  if(!n)return;
  const {error}=await db.from('profiles').upsert({user_id:me.id,name:n});
  if(error){alert('Ошибка: '+error.message);return}
  init();
}
async function loadProfiles(){
  const {data}=await db.from('profiles').select('*');
  profiles={};
  (data||[]).forEach(p=>profiles[p.user_id]=p);
}
async function refresh(){
  await loadProfiles();
  const {data,error}=await db.from('entries').select('*').eq('day',today()).order('id');
  if(error){alert('Ошибка: '+error.message);return}
  rows=data;
  const r2=await db.from('sets').select('*').order('id',{ascending:false}).limit(1000);
  sets=(r2.data||[]).reverse();
  render();
}
const sum=(uid,k)=>rows.filter(r=>r.user_id===uid&&r.kind===k).reduce((a,r)=>a+Number(r.value),0);

function render(){
  const tabs=$('tabs');tabs.innerHTML='';
  Object.keys(profiles).sort((a,b)=>a===me.id?-1:b===me.id?1:0).forEach(id=>{
    const b=document.createElement('button');
    b.textContent=profiles[id].name+(id===me.id?' (я)':'');
    b.className=id===viewId?'tab on':'tab';
    b.onclick=()=>{viewId=id;render()};
    tabs.appendChild(b);
  });
  const own=viewId===me.id,box=$('cards');
  box.innerHTML='';
  const canStr=profiles[viewId].has_strength&&(own||profiles[me.id].show_partner_strength);
  if(!canStr)sub='sum';
  if(canStr){
    const bar=document.createElement('div');bar.className='tabs';
    [['sum','Сводка'],['str','Силовые']].forEach(([k,n])=>{
      const b=document.createElement('button');b.textContent=n;b.className=sub===k?'tab on':'tab';
      b.onclick=()=>{sub=k;render()};bar.appendChild(b);
    });
    box.appendChild(bar);
  }
  if(sub==='str'){renderStrength(box,own);renderSettings(box);return}
  M.forEach(m=>{
    const v=sum(viewId,m.k),g=GOALS[m.k];
    const c=document.createElement('div');c.className='card';
    const head=document.createElement('div');head.className='row';
    const t=document.createElement('b');t.textContent=m.t;
    const s=document.createElement('span');s.textContent=(Math.round(v*10)/10)+(g?' / '+g:'')+' '+m.u;
    head.append(t,s);c.appendChild(head);
    if(g){
      const bar=document.createElement('div');bar.className='bar';
      const i=document.createElement('i');i.style.width=Math.min(100,v/g*100)+'%';
      bar.appendChild(i);c.appendChild(bar);
    }
    if(own){
      const ctl=document.createElement('div');ctl.className='ctl';
      m.quick.forEach(q=>{
        const b=document.createElement('button');b.textContent='+'+q;
        b.onclick=()=>add(m.k,q);ctl.appendChild(b);
      });
      if(m.k!=='toilet'){
        const inp=document.createElement('input');
        inp.type='text';inp.inputMode='decimal';inp.placeholder=m.u;
        const b=document.createElement('button');b.textContent='Добавить';
        b.onclick=()=>add(m.k,parseFloat(inp.value.replace(',','.')));
        ctl.append(inp,b);
      }
      const u=document.createElement('button');u.textContent='↩';u.className='ghost';
      u.title='Отменить последнее';u.onclick=()=>undo(m.k);
      ctl.appendChild(u);
      c.appendChild(ctl);
    }
    box.appendChild(c);
  });
  renderSettings(box);
}
function mk(tag,txt,cls){const e=document.createElement(tag);if(txt)e.textContent=txt;if(cls)e.className=cls;return e}
function renderStrength(box,own){
  const mine=sets.filter(s=>s.user_id===viewId);
  if(own){
    const c=mk('div','','card');
    const dl=mk('datalist');dl.id='ex';
    [...new Set(mine.map(s=>s.exercise))].forEach(n=>{const o=mk('option');o.value=n;dl.appendChild(o)});
    const ex=mk('input');ex.setAttribute('list','ex');ex.placeholder='Упражнение';
    const w=mk('input');w.inputMode='decimal';w.placeholder='Вес, кг (0 если без веса)';
    const r=mk('input');r.inputMode='numeric';r.placeholder='Повторы';
    const b=mk('button','+ Подход');
    b.onclick=()=>addSet(ex.value,parseFloat((w.value||'0').replace(',','.')),parseInt(r.value));
    c.append(dl,ex,w,r,b);box.appendChild(c);
  }
  const t=mine.filter(s=>s.day===today());
  const c1=mk('div','','card');
  c1.appendChild(mk('b','Сегодня'));
  if(!t.length)c1.appendChild(mk('div','Пока пусто','sub mt'));
  t.forEach(s=>{
    const row=mk('div','','row mt');
    row.appendChild(mk('span',s.exercise+': '+Number(s.weight)+' кг × '+s.reps));
    if(own){const x=mk('button','✕','x');x.onclick=()=>delSet(s.id);row.appendChild(x)}
    c1.appendChild(row);
  });
  box.appendChild(c1);
  const g={};
  mine.forEach(s=>(g[s.exercise]=g[s.exercise]||[]).push(s));
  const c2=mk('div','','card');
  c2.appendChild(mk('b','Прогресс'));
  if(!Object.keys(g).length)c2.appendChild(mk('div','Здесь появятся рекорды','sub mt'));
  Object.keys(g).sort().forEach(n=>{
    const a=g[n];
    const best=a.reduce((x,y)=>(Number(y.weight)>Number(x.weight)||(Number(y.weight)===Number(x.weight)&&y.reps>x.reps))?y:x);
    const days=[...new Set(a.map(s=>s.day))].sort();
    const top=d=>Math.max(...a.filter(s=>s.day===d).map(s=>Number(s.weight)));
    const last=days[days.length-1],prev=days[days.length-2];
    let tr='';
    if(prev!==undefined){const d=top(last)-top(prev);tr=d>0?' ▲':d<0?' ▼':' =';}
    const blk=mk('div','','mt');
    blk.appendChild(mk('div',n));
    blk.appendChild(mk('div','Рекорд: '+Number(best.weight)+' кг × '+best.reps,'sub'));
    blk.appendChild(mk('div','Последний раз '+last+': макс. '+top(last)+' кг'+tr,'sub'));
    c2.appendChild(blk);
  });
  box.appendChild(c2);
}
function renderSettings(box){
  if(viewId!==me.id)return;
  const p=profiles[me.id];
  const c=mk('div','','card');
  c.appendChild(mk('b','Настройки'));
  [['has_strength','Я веду силовые (вкладка в моём профиле)'],['show_partner_strength','Показывать силовые партнёра']].forEach(([k,label])=>{
    const l=mk('label','','chk');
    const i=mk('input');i.type='checkbox';i.checked=!!p[k];
    i.onchange=async()=>{
      const {error}=await db.from('profiles').update({[k]:i.checked}).eq('user_id',me.id);
      if(error){alert('Ошибка: '+error.message);return}
      refresh();
    };
    l.append(i,label);c.appendChild(l);
  });
  box.appendChild(c);
}
async function addSet(ex,w,r){
  ex=ex.trim();ex=ex.charAt(0).toUpperCase()+ex.slice(1);
  if(!ex||isNaN(w)||w<0||!(r>0)){alert('Заполни упражнение, вес и повторы');return}
  const {error}=await db.from('sets').insert({exercise:ex,weight:w,reps:r,day:today()});
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function delSet(id){
  const {error}=await db.from('sets').delete().eq('id',id);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function add(k,v){
  if(!(v>0)){alert('Введи число больше нуля');return}
  const {error}=await db.from('entries').insert({kind:k,value:v,day:today()});
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
async function undo(k){
  const mine=rows.filter(r=>r.user_id===me.id&&r.kind===k);
  if(!mine.length)return;
  const {error}=await db.from('entries').delete().eq('id',mine[mine.length-1].id);
  if(error){alert('Ошибка: '+error.message);return}
  refresh();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&me)refresh()});
init();
</script>
</body></html>
